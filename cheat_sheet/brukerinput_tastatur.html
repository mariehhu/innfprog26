<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheet sheep brukerinput for tastatur</title>
</head>
<body>
    <p>Retning: <span id="direction"></span></p>
    <ul id="tastetrykk">

    </ul>

    <ul id="tasteslipp">

    </ul>

    <script>
        //event som sjekker etter når vi trykker NED en tast
        document.addEventListener("keydown", function (event) {
            document.getElementById("tasketrykk").innerHTML += `<li>Tasten ${event.key} med kode 
            ${event.code} er trykket ned</li>`
        })

        //event som sjekker etter når vi trykker NED en tast
        document.addEventListener("keyup", function (event) {
            document.getElementById("tasteslipp").innerHTML += `<li>Tasten ${event.key} med kode 
            ${event.code} er sluppet opp</li>`
        })


        
        //sjekke om piltaster er trykket ned, og bestemme retning:
        let direction = ""
        const pd = documetn.getElementById("direction")
        //pd = paragraph direction, sparer mye kode på denne måten 

        document.addEventListener("keydown", function (event) {
            if(event.key === "a") {
                direction = "left"
            }

            if(event.key === "w") {
                direction = "up"
            }

            if(event.key === "s") {
                direction = "down"
            }

            if(event.key === "d") {
                direction = "right"
            }
            
            pd.innerHTML = direction 
            
        })

        document.addEventListener("keyup", function (event){
            if(event.key === "a" || event.key === "w" || event.key === "s" || event.key === "d") {
                direction = null
                pd.inner = direction
            }
        })
    </script>
    
</body>
</html>
