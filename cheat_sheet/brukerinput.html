<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheet sheep for brukerinput</title>

    <style>
        section {
            max-width: 600px;
            margin: 1rem auto;
            box-sizing: border-box;
            padding: 1rem;
            border: 1px dotted #ccc;
        }
    </style>
</head>
<body>
    
    <section>
        <button onclick="showMessage()" id="vismelding">Klikk meg</button>
    </section>
    
    <section>
        <form onsubmit="logName">
            <input type="text" id="firstname" name="firstname" placeholder="Firstname" />
            <button type="submit">Lagre</button>
        </form>
    </section>
    
    <section>
        <form id="lastnameForm">
            <input type="text" id="lastname" name="lastname" placeholder="lastname" />
            <button type="submit">Lagre</button>
        </form>
    </section>

    <section>
        <h2>addEventListener: Click</h2>
        <input type="number" id="birthyear" name="birthyear" />
        <button id="callCalculate">Regn ut alder</button>
    </section>

    <section>
        <h2>addEventListener: Input</h2>
        <input type="number" id="birthyearLive" name="birthyearLive" />
        <p>Du er <span id="ageLive"></span> hvis du er født i <span id="birthyearLivePrint"></span></p>
    </section>
    

    <script>
        function showMessage() {
            alert("Au, ikke klikk meg")
        }

        //funsjon som kalles når skjema sendes inn
        function logName() {
            const inputFirstname = document.getElementByID("firstname").value 
            console.log(inputFirstname)
        }

        //funksjon som kjører når vi merker brukerhendelsen sumbit på skjema med id lasnameForm
        document.getElementById("lastnameForm").addEventListener("submit", function(event) {
            event.preventDefault()
            console.log(event)
            const inputLastname = document.getElementById("lastname").value
            console.log(inputLastname)
        })

        //eventListener som sjekker etter klikk på HTML-elementet med id callCalculate
        document.getElementById("callCalculate").addEventListener("click", function (event) {
            const birthyear = document.getElementById("birthyear").value
            console.log(birthyear)
            const age = 2026 - birthyear
            alert("Du er " + age + " år gammel hvis du er født i " + birthyear)
        })

        //EventListener som sjekker all input i et input-felt. Funsjonen kjøres for hver eneste endring
        document.getElementById("birthyearLive").addEventListener("input", function (event) {
            const birthyearLive = document.getElementById("birthyearLive").value
            const ageLive = 2026 - birthyearLive
            document.getElementById("ageLive").innerHTML = ageLive
            document.getElementById("birthyearLivePrint").innerHTML = birthyearLive

        })

        
    </script>
</body>
</html>
